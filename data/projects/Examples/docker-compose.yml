version: '3.8'

services:
  web:
    image: nginx:1.27-alpine
    container_name: test-web
    ports:
      - "8080:80"
    environment:
      NGINX_HOST: example.com
      NGINX_PORT: 80
    volumes:
      - ./html:/usr/share/nginx/html:ro
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: test-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: testdb
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  db-data:
