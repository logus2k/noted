# Machine-readable scenarios for the `noted-platform-overview` skill test doc.
# Human-readable counterpart: noted-platform-overview.md.
#
# CAVEAT: this skill is priority=3 with trigger `user_asks_about_noted`,
# which is NOT currently emitted by the context builder. The skill therefore
# does NOT auto-inject on the current build. Scenarios may still PASS if the
# model's base knowledge covers the topic; scenarios that specifically need
# skill body content (e.g. the "12 containers" list) may FAIL - that failure
# is a legitimate signal to raise the skill's priority or wire a real trigger.

doc_id: noted-platform-overview
doc_type: skill

scenarios:
  - scenario_id: S1
    title: "Direct 'what is noted?'"
    tags: [skill, overview]
    setup:
      project: noted-testing
    user_request: "what is noted?"
    expected_tools_called: []
    expected_tools_NOT_called:
      - get_notebook_cells
      - get_file_contents
      - list_files
      - query_knowledge_graph
      - fetch_url
    expected_answer_focus: |
      - name it as an on-premises collaborative notebook and MLOps platform
      - mention Jupyter-compatible notebooks and the MLOps integrations (MLflow, Airflow, DVC, Hydra)
      - do not claim cloud features

  - scenario_id: S2
    title: "What does the stack look like?"
    tags: [skill, overview]
    setup:
      project: noted-testing
    user_request: "what does the stack look like?"
    expected_tools_called: []
    expected_tools_NOT_called:
      - query_knowledge_graph
      - list_files
    expected_answer_focus: |
      - list the Docker containers involved (noted, mlflow, airflow services, minio, serving, graph, postgres, redis)
      - note Docker Compose orchestration
      - note on-premises with no cloud dependency

  - scenario_id: S3
    title: "Which MLOps tools are integrated?"
    tags: [skill, overview]
    setup:
      project: noted-testing
    user_request: "which MLOps tools are integrated with noted?"
    expected_tools_called: []
    expected_tools_NOT_called:
      - fetch_url
      - list_files
    expected_answer_focus: |
      - MLflow (tracking + registry + serving)
      - Airflow (orchestration)
      - DVC (backed by MinIO)
      - Hydra (config management)
      - Knowledge Graph
      - must not invent integrations that do not exist

  - scenario_id: S4
    title: "Project vs mount distinction"
    tags: [skill, overview]
    setup:
      project: noted-testing
    user_request: "what's the difference between a project and a mount?"
    expected_tools_called: []
    expected_tools_NOT_called:
      - list_files
    expected_answer_focus: |
      - projects hold notebooks, code, configs, DAGs
      - mounts are external directories exposed to noted with read-write access
      - do not conflate the two

  - scenario_id: S5
    title: "Run Manager concept"
    tags: [skill, overview]
    setup:
      project: noted-testing
    user_request: "what is the Run Manager?"
    expected_tools_called: []
    expected_tools_NOT_called:
      - get_experiment_runs
      - get_notebook_cells
    expected_answer_focus: |
      - defines cell groups as named runs
      - executes with automatic MLflow start/end and framework autologging
      - must NOT tell the user to manually write mlflow.start_run()

  - scenario_id: S6
    title: "Lineage chain explanation"
    tags: [skill, overview]
    setup:
      project: noted-testing
    user_request: "how does noted track lineage across tools?"
    expected_tools_called: []
    expected_tools_NOT_called:
      - query_knowledge_graph
    expected_answer_focus: |
      - describe the chain in order: Data (DVC) -> Config (Hydra) -> Code (Git) -> Pipeline (Airflow) -> Run (MLflow) -> Model (Registry)

  - scenario_id: S7
    title: "Live Metrics streaming"
    tags: [skill, overview]
    setup:
      project: noted-testing
    user_request: "how does real-time metric streaming work?"
    expected_tools_called: []
    expected_tools_NOT_called:
      - search_files
      - get_notebook_cells
    expected_answer_focus: |
      - Live Metrics streams training metrics during execution via Socket.IO
      - brief is fine; do not fabricate implementation specifics

  - scenario_id: S8
    title: "Scope boundary: noted is NOT a managed cloud service"
    tags: [skill, overview]
    setup:
      project: noted-testing
    user_request: "is noted a cloud service like SageMaker?"
    expected_tools_called: []
    expected_tools_NOT_called:
      - fetch_url
      - list_files
    expected_answer_focus: |
      - no, noted is on-premises with zero cloud dependency
      - brief contrast with managed cloud platforms is fine
      - must not refuse to answer or hedge excessively

  - scenario_id: S9
    title: "Editor technology"
    tags: [skill, overview]
    setup:
      project: noted-testing
    user_request: "what editor does noted use for notebooks?"
    expected_tools_called: []
    expected_tools_NOT_called:
      - list_files
      - search_files
    expected_answer_focus: |
      - CodeMirror 6
      - Jupyter-compatible format
      - must NOT claim JupyterLab or Monaco

  - scenario_id: S10
    title: "Multi-venv capability"
    tags: [skill, overview]
    setup:
      project: noted-testing
    user_request: "can I have different Python environments per project?"
    expected_tools_called: []
    expected_tools_NOT_called:
      - list_files
    expected_answer_focus: |
      - yes, multiple Python runtimes/venvs per project is a core capability
      - must NOT tell the user to set up venvs manually with pyenv

  - scenario_id: S11
    title: "Real-time collaboration"
    tags: [skill, overview]
    setup:
      project: noted-testing
    user_request: "can two people edit the same notebook at once?"
    expected_tools_called: []
    expected_tools_NOT_called:
      - fetch_url
    expected_answer_focus: |
      - yes, real-time collaboration via Socket.IO is supported
      - brief answer is fine

  - scenario_id: S12
    title: "Primary surface of interaction"
    tags: [skill, overview]
    setup:
      project: noted-testing
    user_request: "where do users spend most of their time in noted?"
    expected_tools_called: []
    expected_tools_NOT_called:
      - get_file_contents
    expected_answer_focus: |
      - primarily the notebook editor and Explorer panel
      - MLOps tools are accessed without leaving the notebook environment

  - scenario_id: S13
    title: "Workflow orientation (conceptual)"
    tags: [skill, overview]
    setup:
      project: noted-testing
    user_request: "walk me through a typical end-to-end workflow on noted"
    expected_tools_called: []
    expected_tools_NOT_called:
      - list_dags
      - get_experiment_runs
    expected_answer_focus: |
      - cover all the pieces of an end-to-end workflow (any reasonable ordering):
          notebook editing, Hydra configuration, DVC data versioning, Run Manager,
          MLflow tracking, Airflow orchestration (optional), model registration, deployment
      - must NOT invent phases that are not actually in noted
      - ordering is not strict - stepping through in a plausible sequence is sufficient

  - scenario_id: S14
    title: "Knowledge Graph (concept vs query distinction)"
    tags: [skill, overview]
    setup:
      project: noted-testing
    user_request: "what does the knowledge graph do?"
    expected_tools_called: []
    expected_tools_NOT_called:
      - query_knowledge_graph
    expected_answer_focus: |
      - describe as entity relationship visualization across projects
      - it is a capability; user is asking the concept, not requesting a query
      - must NOT call query_knowledge_graph (that would answer a different question)
