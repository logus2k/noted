scenarios:
  - scenario_id: S1
    title: "Grid sweep"
    tags: [skill, airflow, sweep]
    setup:
      project: noted-testing
    user_request: "how do I set up a grid sweep over learning rate and batch size?"
    expected_tools_called: []
