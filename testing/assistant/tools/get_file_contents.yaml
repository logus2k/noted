# Machine-readable scenarios for the `get_file_contents` tool test doc.

doc_id: get_file_contents
doc_type: tool

# Scenarios covered: S1, S2, S3, S4, S5, S6 (6 of 8).
# DEFERRED: S7 (binary file rejection), S8 (file with non-UTF8).

scenarios:
  - scenario_id: S1
    title: "Read a Python file"
    tags: [read, files]
    setup:
      project: noted-testing
    user_request: "show me the contents of src/training/train.py"
    expected_tools_called:
      - name: get_file_contents
        exact_count: 1
        args_match:
          path: "src/training/train.py"
    expected_tools_NOT_called:
      - search_files
    expected_answer_focus: |
      - report file contents from the tool result
      - if file does not exist, report and suggest list_files

  - scenario_id: S2
    title: "Limit lines"
    tags: [read, files]
    setup:
      project: noted-testing
    user_request: "show me the first 30 lines of src/training/train.py"
    expected_tools_called:
      - name: get_file_contents
        exact_count: 1
        args_match:
          path: "src/training/train.py"
          max_lines: 30
    expected_tools_NOT_called: []
    expected_answer_focus: |
      - report only the first 30 lines
      - mention that the file may have more lines

  - scenario_id: S3
    title: "Nonexistent file"
    tags: [read, files, error]
    setup:
      project: noted-testing
    user_request: "show me the contents of imaginary_file.py"
    expected_tools_called:
      - name: get_file_contents
        exact_count: 1
        args_match:
          path: "imaginary_file.py"
    expected_tools_NOT_called: []
    expected_answer_focus: |
      - tool returns error
      - report not found; suggest list_files or search_files
      - do NOT fabricate content

  - scenario_id: S4
    title: "Read config file"
    tags: [read, files, config]
    setup:
      project: noted-testing
    user_request: "what's in the main config.yaml?"
    expected_tools_called:
      - name: get_file_contents
        exact_count: 1
        args_match:
          path: "config/config.yaml"
    expected_tools_NOT_called:
      - get_hydra_config
    expected_answer_focus: |
      - read the file
      - explain key sections (data, model, training)
      - get_hydra_config is for the RESOLVED config; raw file read is asked here

  - scenario_id: S5
    title: "Multi-turn discover then read"
    tags: [read, files, workflow]
    setup:
      project: noted-testing
    turns:
      - user_request: "list python files in src/"
        expected_tools_called:
          - name: list_files
            exact_count: 1
        expected_tools_NOT_called:
          - get_file_contents
        expected_answer_focus: "list .py files"
      - user_request: "open the first one"
        expected_tools_called:
          - name: get_file_contents
            exact_count: 1
        expected_tools_NOT_called:
          - list_files
        expected_answer_focus: "use the path from prior turn"

  - scenario_id: S6
    title: "Search vs read clarification"
    tags: [read, files, ambiguity]
    setup:
      project: noted-testing
    user_request: "where is the train_model function defined?"
    expected_tools_called:
      - name: search_files
        exact_count: 1
    expected_tools_NOT_called:
      - get_file_contents
    expected_answer_focus: |
      - "where is X defined" maps to search_files, not get_file_contents
      - get_file_contents is for known paths
      - calling get_file_contents AFTER search_files locates the file is acceptable
