events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # WebSocket upgrade support
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    server {
        listen 80;
        server_name _;

        # ===================== noted (root) =====================
        location /static/ {
            proxy_pass http://noted:8123/static/;
            proxy_http_version 1.1;

            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_pass_header Accept-Ranges;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /socket.io/ {
            proxy_pass http://noted:8123/socket.io/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin $http_origin;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;

            add_header Cache-Control "no-store";
        }

        # ===================== MCP Server =====================
        location ^~ /mcp/ {
            proxy_pass http://noted:8123/mcp/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streamable HTTP: no buffering, long timeouts for streaming responses
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            chunked_transfer_encoding on;
            add_header X-Accel-Buffering no;
        }

        location / {
            proxy_pass http://noted:8123/;
            proxy_http_version 1.1;

            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_pass_header Accept-Ranges;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin $http_origin;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ===================== MLflow =====================
        location = /mlflow {
            return 301 /mlflow/;
        }

        location ^~ /mlflow/ {
            proxy_pass http://mlflow:5000;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /mlflow;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        }

        # ===================== Airflow =====================
        location = /airflow {
            return 301 /airflow/;
        }

        location ^~ /airflow/ {
            proxy_pass http://airflow-apiserver:8080;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /airflow;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        }

        # ===================== MinIO =====================
        location = /minio {
            return 301 /minio/;
        }

        location ^~ /minio/ {
            proxy_pass http://minio:9001/;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        }

        # ===================== Evidently =====================
        location = /evidently {
            return 301 /evidently/;
        }

        location ^~ /evidently/ {
            proxy_pass http://evidently:8000/;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;

            # Rewrite HTML so the SPA knows its base path and assets resolve correctly
            sub_filter_once off;
            sub_filter_types text/html application/javascript;
            sub_filter '<head>' '<head><script>if(location.pathname.startsWith("/evidently")){history.replaceState(null,"",location.pathname.replace(/^\/evidently/,"")||"/")}</script>';
            sub_filter 'href="/static/' 'href="/evidently/static/';
            sub_filter 'src="/static/' 'src="/evidently/static/';
            sub_filter 'href="/manifest.json"' 'href="/evidently/manifest.json"';
            sub_filter 'href="/favicon.ico"' 'href="/evidently/favicon.ico"';
            sub_filter 'crossorigin href="/static/' 'crossorigin href="/evidently/static/';
            sub_filter 'crossorigin src="/static/' 'crossorigin src="/evidently/static/';
            sub_filter '"/api/' '"/evidently/api/';
        }

        # ===================== ArcadeDB Studio =====================
        location = /arcadedb {
            return 301 /arcadedb/;
        }

        location ^~ /arcadedb/ {
            proxy_pass http://noted-arcadedb:2480/;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;

            # ArcadeDB Studio is an SPA that uses absolute paths (/api/, /studio/)
            # for its assets; rewrite the HTML so it resolves under /arcadedb/.
            sub_filter_once off;
            sub_filter_types text/html application/javascript text/javascript;
            sub_filter 'href="/' 'href="/arcadedb/';
            sub_filter 'src="/' 'src="/arcadedb/';
            sub_filter '"/api/' '"/arcadedb/api/';
            sub_filter "'/api/" "'/arcadedb/api/";
        }

        # ===================== MinIO API =====================
        location ^~ /minio-api/ {
            proxy_pass http://minio:9000/;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
        }
    }
}
