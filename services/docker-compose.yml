---
x-airflow-common:
  &airflow-common
  build: ./airflow
  networks:
    - noted-network
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/airflow/execution/'
    AIRFLOW__API__BASE_URL: https://logus2k.com/airflow
    AIRFLOW__WEBSERVER__BASE_URL: https://logus2k.com/airflow
    AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    TF_CPP_MIN_LOG_LEVEL: '3'
    TF_ENABLE_ONEDNN_OPTS: '0'
    GRPC_VERBOSITY: 'ERROR'
  volumes:
    - ${AIRFLOW_PROJ_DIR:-./airflow}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-./airflow}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-./airflow}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-./airflow}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-./airflow}/data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  # ===================== Noted =====================
  noted:
    image: logus2k/noted
    container_name: noted
    build:
      context: ..
    pull_policy: never
    ports:
      - "8123:8123"
      - "3719:3719"
    environment:
      - NOTED_TERMINAL_SECRET=${NOTED_TERMINAL_SECRET:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - NOTED_MAX_UPLOAD_MB=${NOTED_MAX_UPLOAD_MB:-20}
    volumes:
      - ../data:/app/data
      - ../.noted:/app/.noted
      # Phase 12 model_manager: mount the GGUF directories at the SAME
      # container paths llama-vision uses, so /api/models can stat the
      # files for vram_estimate without path translation. Both read-only.
      - ${HOME}/env/assets/agent_server/data/models:/agent_server_models:ro
      - ../data/models:/noted_models:ro
      # Mount volumes are auto-generated in ../data/docker-compose.mounts.yml
      # Include with: -f ../data/docker-compose.mounts.yml
    networks:
      - noted-network
    restart: unless-stopped

  # ===================== PostgreSQL (Airflow metadata) =====================
  postgres:
    image: postgres:16
    container_name: noted-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - noted-network
    restart: always

  # ===================== Redis (Airflow Celery broker) =====================
  redis:
    image: redis:7.2-bookworm
    container_name: noted-redis
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    networks:
      - noted-network
    restart: always

  # ===================== Airflow =====================
  airflow-apiserver:
    <<: *airflow-common
    container_name: noted-airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: noted-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: noted-airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: noted-airflow-worker
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-./airflow}/dags:/opt/airflow/dags
      - ${AIRFLOW_PROJ_DIR:-./airflow}/logs:/opt/airflow/logs
      - ${AIRFLOW_PROJ_DIR:-./airflow}/config:/opt/airflow/config
      - ${AIRFLOW_PROJ_DIR:-./airflow}/plugins:/opt/airflow/plugins
      - ${AIRFLOW_PROJ_DIR:-./airflow}/data:/opt/airflow/data
      - ../data/projects:/opt/noted/projects:ro
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: noted-airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    container_name: noted-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        /entrypoint airflow version
        /entrypoint airflow config list >/dev/null
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    container_name: noted-airflow-cli
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

  flower:
    <<: *airflow-common
    container_name: noted-airflow-flower
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ===================== MLflow =====================
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: noted-mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:////mlflow/mlflow.db
      - MLFLOW_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    command: ["bash", "-c", "pip install plotly && mlflow server --static-prefix /mlflow --host 0.0.0.0 --allowed-hosts '*' --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root mlflow-artifacts:/ --artifacts-destination /mlflow/artifacts --serve-artifacts"]
    networks:
      - noted-network
    restart: always

  # ===================== MinIO =====================
  minio:
    image: minio/minio:latest
    container_name: noted-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
      MINIO_BROWSER_REDIRECT_URL: http://localhost/minio
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - noted-network
    restart: always

  # ===================== ArcadeDB (Graph Persistence) =====================
  noted-arcadedb:
    # 26.3.2 is the current stable release (2026-03-21). Avoid :latest —
    # on Docker Hub it points at a SNAPSHOT nightly build.
    image: arcadedata/arcadedb:26.3.2
    container_name: noted-arcadedb
    networks:
      - noted-network
    environment:
      # The image's bin/server.sh enables a remote JMX agent by default
      # (ports 9998/9999) which can't construct a JMXServiceURL when
      # InetAddress.getLocalHost() resolution flakes, aborting the JVM.
      # We don't use JMX, so set the var to a no-op -D so the script's
      # `if [ -z "$ARCADEDB_JMX" ]` skips the default block.
      ARCADEDB_JMX: "-Dnoted.jmx.disabled=true"
      # Preserve the image's ZGC GC flags while adding the root password
      # and default database bootstrap. Overwriting JAVA_OPTS without the
      # GC flags is a performance regression.
      JAVA_OPTS: >-
        -XX:+UseZGC
        -XX:+ZGenerational
        -Darcadedb.server.rootPassword=noted-dev
        -Darcadedb.server.defaultDatabases=noted[root]
    volumes:
      - ../data/arcadedb:/home/arcadedb/databases
    ports:
      # HTTP (Studio UI + REST + Cypher-over-HTTP)
      - "2480:2480"
      # Gremlin (traversal escape hatch — not used in Phase 1 app code)
      - "8182:8182"
    restart: unless-stopped

  # ===================== Knowledge Graph =====================
  noted-graph:
    build: ../graph
    container_name: noted-graph
    networks:
      - noted-network
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AIRFLOW_API_URL: http://noted-airflow-apiserver:8080
      AIRFLOW_BASE_PATH: /airflow
      AIRFLOW_USERNAME: airflow
      AIRFLOW_PASSWORD: airflow
      NOTED_API_URL: http://noted:8123
      PROJECTS_DIR: /app/data/projects
      MOUNTS_DIR: /app/mounts
      GRAPH_PORT: "5523"
      ARCADEDB_URL: http://noted-arcadedb:2480
      ARCADEDB_DATABASE: noted
      ARCADEDB_USER: root
      ARCADEDB_PASSWORD: noted-dev
      # Docling (PDF / DOCX / PPTX / HTML ingestion); see services/.env.
      # Cache directory shares /data/models with noted-rag so model weights
      # live alongside bge-m3 / bge-reranker rather than in a separate tree.
      DOCLING_CACHE_DIR: /data/models/docling
      DOCLING_GPU_ENABLED: ${DOCLING_GPU_ENABLED:-auto}
      DOCLING_TABLE_MODE: ${DOCLING_TABLE_MODE:-accurate}
      DOCLING_MAX_PAGES: ${DOCLING_MAX_PAGES:-2000}
      DOCLING_OCR: ${DOCLING_OCR:-false}
      # Picture + table caption pass during ingest. When ON, every
      # Docling PictureItem / TableItem in a converted PDF/DOCX/PPTX/HTML
      # gets a short LLM caption (via agent_server's picture_describer /
      # table_describer presets) injected into the chunk stream so it
      # flows through embed + extraction identically to native text.
      ENABLE_DOC_DESCRIPTIONS: ${ENABLE_DOC_DESCRIPTIONS:-true}
    volumes:
      # data/ is RW because noted-graph writes the corpus config + uploads
      # via the UI-driven /research/corpus endpoints. Application code is
      # the sole arbiter of which paths under data/ get written.
      - ../data:/app/data
      # Prose corpus for GraphRAG md_scanner (Phase 1C):
      - ../documents:/app/documents:ro
      # External corpus: project report (mirrors noted-rag's pattern).
      - ${HOME}/env/iscte/jena_weather/report:/app/jena_weather_report:ro
      # Shared model cache: bge-m3, bge-reranker, Docling weights, etc.
      # noted-rag mounts the same path; DOCLING_CACHE_DIR pins Docling to
      # /data/models/docling so its tree is namespaced inside the share.
      - ../data/models:/data/models
    ports:
      - "5523:5523"
    depends_on:
      - noted-arcadedb
    restart: unless-stopped

  # ===================== Evidently =====================
  evidently:
    image: evidently/evidently-service:latest
    container_name: noted-evidently
    ports:
      - "8009:8000"
    volumes:
      - evidently-data:/app/workspace
    networks:
      - noted-network
    restart: always

  # ===================== Model Serving =====================
  noted-serving:
    build: ../client
    container_name: noted-serving
    networks:
      - noted-network
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SERVING_HOST: "0.0.0.0"
      SERVING_PORT: "5522"
      CUDA_VISIBLE_DEVICES: ""
      TF_CPP_MIN_LOG_LEVEL: "3"
      TF_ENABLE_ONEDNN_OPTS: "0"
    ports:
      - "5522:5522"
    restart: unless-stopped

  # ===================== RAG sidecar (docs retrieval) =====================
  # Embedding + rerank forwarded over HTTP to llama-vision (agent_server's
  # llama-server router on noted-network). No GPU here, no model weights.
  noted-rag:
    build: ../noted-rag
    container_name: noted-rag
    networks:
      - noted-network
    environment:
      - CHROMA_DIR=/data/vectordb
      - DOC_ROOT=/docs
      - LLAMA_SERVER_URL=http://llama-vision:8500
    volumes:
      # Persistent vector DB (bind-mounted, survives container rebuild)
      - ../data/vectordb:/data/vectordb
      # Docs corpus (read-only, narrow explicit set — see noted-rag/app/ingest.py _SOURCES)
      - ../documents:/docs/documents:ro
      - ../data/documents:/docs/data/documents:ro
      - ../README.md:/docs/README.md:ro
      - ../NOTED_SETUP.md:/docs/NOTED_SETUP.md:ro
      - ${HOME}/env/iscte/jena_weather/report:/docs/jena_weather_report:ro
    ports:
      - "8201:8200"
    restart: unless-stopped

  # ===================== Self-authored tools host =====================
  # MCP server hosting tools generated by the self-learning loop.
  # Phase A.1: empty-registry skeleton. Subsequent phases add the file
  # watcher (A.2), per-tool venvs (A.3), subprocess executor (A.4),
  # MCP federation into noted's tool list (A.5), audit log (A.6).
  noted-tools:
    build: ../noted-tools
    container_name: noted-tools
    user: "1000:1000"
    networks:
      - noted-network
    environment:
      # Multi-tenant ready: per-tenant tools live under data/tenants/<id>/user_tools.
      # Single-tenant fallback uses the "default" tenant id until the auth plan
      # propagates X-Forwarded-User from oauth2-proxy.
      - USER_TOOLS_DIR=/app/data/tenants/default/user_tools
      - SKILLS_DIR=/app/data/skills
    volumes:
      - ../data/tenants:/app/data/tenants
      - ../data/skills:/app/data/skills:ro
    ports:
      - "7702:7702"
    restart: unless-stopped

networks:
  noted-network:
    name: noted-network

volumes:
  postgres-data:
  mlflow-data:
  minio-data:
  evidently-data:
