events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # WebSocket upgrade support
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    server {
        listen 6543;
        server_name _;

        # ===================== noted (root) =====================
        location /static/ {
            proxy_pass http://noted:8123/static/;
            proxy_http_version 1.1;

            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_pass_header Accept-Ranges;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /socket.io/ {
            proxy_pass http://noted:8123/socket.io/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin $http_origin;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;

            add_header Cache-Control "no-store";
        }

        location / {
            proxy_pass http://noted:8123/;
            proxy_http_version 1.1;

            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_pass_header Accept-Ranges;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin $http_origin;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ===================== MLflow =====================
        location = /mlflow {
            return 301 /mlflow/;
        }

        location ^~ /mlflow/ {
            proxy_pass http://mlflow:5000;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /mlflow;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        }

        # ===================== Airflow =====================
        location = /airflow {
            return 301 /airflow/;
        }

        location ^~ /airflow/ {
            proxy_pass http://airflow-apiserver:8080;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /airflow;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        }

        # ===================== MinIO =====================
        location = /minio {
            return 301 /minio/;
        }

        location ^~ /minio/ {
            proxy_pass http://minio:9001/;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        }

        # ===================== MinIO API =====================
        location ^~ /minio-api/ {
            proxy_pass http://minio:9000/;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
        }
    }
}
